<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Metadata AI — все экраны приложения</title>
<meta name="description" content="Все экраны Photo Metadata AI: онбординг, загрузка, обработка, проверка метаданных и экспорт. Сборка 1.1.0-universal.">
<link rel="icon" href="../../desktop/build/icon.svg">
<style>
  :root {
    --bg: #0b0b0f;
    --bg-soft: #121218;
    --panel: #17171d;
    --panel-2: #1d1d25;
    --line: rgba(255, 255, 255, 0.09);
    --line-strong: rgba(255, 255, 255, 0.16);
    --text: #ececf1;
    --muted: #a1a1ae;
    --dim: #77778a;
    --accent: #8b88f8;
    --accent-2: #aaa8ff;
    --accent-dim: rgba(139, 136, 248, 0.14);
    --radius: 16px;
    --maxw: 1120px;
    --header-h: 64px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  a { color: var(--accent-2); text-decoration: none; }
  a:hover { text-decoration: underline; }
  img { max-width: 100%; display: block; }

  .wrap { width: 100%; max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(11, 11, 15, 0.82);
    backdrop-filter: saturate(160%) blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .nav { display: flex; align-items: center; gap: 20px; height: var(--header-h); }
  .brand {
    display: flex;
    align-items: center;
    gap: 11px;
    font-weight: 600;
    color: var(--text);
    margin-right: auto;
  }
  .brand:hover { text-decoration: none; }
  .brand img { width: 30px; height: 30px; border-radius: 8px; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 9px 16px;
    border-radius: 11px;
    font-size: 14px;
    font-weight: 550;
    border: 1px solid var(--line-strong);
    color: var(--text);
    background: rgba(255, 255, 255, 0.03);
    white-space: nowrap;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.07); text-decoration: none; }
  .btn-primary {
    background: linear-gradient(180deg, #8f8cfa, #6f6ce4);
    border-color: transparent;
    color: #0d0d14;
  }
  .btn-primary:hover { filter: brightness(1.07); background: linear-gradient(180deg, #8f8cfa, #6f6ce4); }

  .intro { padding: 56px 0 28px; }
  .eyebrow {
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    margin: 0 0 12px;
  }
  h1 {
    margin: 0 0 12px;
    font-size: clamp(30px, 4.4vw, 42px);
    line-height: 1.14;
    letter-spacing: -0.022em;
    font-weight: 660;
  }
  .lede { margin: 0; max-width: 68ch; color: var(--muted); font-size: 17px; }

  .gallery {
    display: grid;
    gap: 20px;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    padding-bottom: 80px;
  }

  .gallery button {
    display: block;
    width: 100%;
    padding: 0;
    text-align: left;
    font: inherit;
    color: inherit;
    cursor: zoom-in;
    border: 1px solid var(--line);
    border-radius: 13px;
    background: var(--panel);
    overflow: hidden;
    transition: border-color .18s ease, transform .18s ease;
  }
  .gallery button:hover { border-color: var(--line-strong); transform: translateY(-2px); }
  .gallery button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .gallery img {
    width: 100%;
    aspect-ratio: 16 / 11;
    object-fit: cover;
    object-position: top center;
    background: #0a0a0e;
    border-bottom: 1px solid var(--line);
  }
  .gallery .meta { padding: 15px 17px 17px; }
  .gallery .meta b { display: block; font-size: 15px; font-weight: 600; margin-bottom: 5px; }
  .gallery .meta span { color: var(--dim); font-size: 14px; line-height: 1.5; }

  /* ---------- lightbox ---------- */

  dialog.lightbox {
    width: min(96vw, 1500px);
    max-width: 96vw;
    max-height: 94vh;
    padding: 0;
    border: 1px solid var(--line-strong);
    border-radius: 16px;
    background: var(--bg-soft);
    color: var(--text);
    overflow: hidden;
  }
  dialog.lightbox::backdrop { background: rgba(6, 6, 9, 0.86); }

  .lb-bar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 14px 12px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .lb-title { font-size: 15px; font-weight: 600; margin-right: auto; }
  .lb-count { color: var(--dim); font-size: 13.5px; font-variant-numeric: tabular-nums; }

  .lb-btn {
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    border-radius: 9px;
    border: 1px solid var(--line-strong);
    background: rgba(255, 255, 255, 0.03);
    color: var(--text);
    cursor: pointer;
  }
  .lb-btn:hover { background: rgba(255, 255, 255, 0.09); }
  .lb-btn:disabled { opacity: .35; cursor: default; }
  .lb-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .lb-body { padding: 16px; background: #0a0a0e; }
  .lb-body img {
    width: 100%;
    max-height: calc(94vh - 150px);
    object-fit: contain;
    border-radius: 8px;
  }
  .lb-caption {
    padding: 0 20px 18px;
    color: var(--dim);
    font-size: 14.5px;
  }

  @media (max-width: 720px) {
    .intro { padding-top: 40px; }
    .lb-title { font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .gallery button { transition: none; }
  }
</style>
</head>

<dialog class="lightbox" id="lightbox">
  <div class="lb-bar">
    <span class="lb-title" id="lb-title"></span>
    <span class="lb-count" id="lb-count"></span>
    <button type="button" class="lb-btn" id="lb-prev" aria-label="Предыдущий экран">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button type="button" class="lb-btn" id="lb-next" aria-label="Следующий экран">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button type="button" class="lb-btn" id="lb-close" aria-label="Закрыть">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="lb-body"><img id="lb-img" src="" alt=""></div>
  <p class="lb-caption" id="lb-caption"></p>
</dialog>

<script>
  (function () {
    var items = Array.prototype.slice.call(
      document.querySelectorAll('#gallery button')
    );
    var dialog = document.getElementById('lightbox');
    var img = document.getElementById('lb-img');
    var title = document.getElementById('lb-title');
    var caption = document.getElementById('lb-caption');
    var count = document.getElementById('lb-count');
    var prev = document.getElementById('lb-prev');
    var next = document.getElementById('lb-next');
    var current = 0;

    function show(index) {
      if (index < 0 || index >= items.length) return;
      current = index;
      var item = items[index];
      img.src = item.getAttribute('data-src');
      img.alt = item.getAttribute('data-title');
      title.textContent = item.getAttribute('data-title');
      caption.textContent = item.getAttribute('data-caption');
      count.textContent = (index + 1) + ' / ' + items.length;
      prev.disabled = index === 0;
      next.disabled = index === items.length - 1;
    }

    items.forEach(function (item, index) {
      item.addEventListener('click', function () {
        show(index);
        dialog.showModal();
      });
    });

    prev.addEventListener('click', function () { show(current - 1); });
    next.addEventListener('click', function () { show(current + 1); });
    document.getElementById('lb-close').addEventListener('click', function () {
      dialog.close();
    });

    dialog.addEventListener('keydown', function (event) {
      if (event.key === 'ArrowRight') { event.preventDefault(); show(current + 1); }
      if (event.key === 'ArrowLeft') { event.preventDefault(); show(current - 1); }
    });

    // Клик по подложке вокруг картинки закрывает окно.
    dialog.addEventListener('click', function (event) {
      if (event.target === dialog) dialog.close();
    });
  })();
</script>
