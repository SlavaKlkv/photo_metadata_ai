<!-- Каскад галереи: класс до первой отрисовки body, чтобы плитки
     не мигали opacity 1→0. Без JS / при reduce класс не ставится. -->
<script>
(function () {
  try {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  } catch (e) { return; }
  document.documentElement.classList.add('js-cascade');
})();
</script>
<style>
  :root {
    --bg: #0b0b0f;
    --bg-soft: #121218;
    --panel: #17171d;
    --panel-2: #1d1d25;
    --line: rgba(255, 255, 255, 0.09);
    --line-strong: rgba(255, 255, 255, 0.16);
    --text: #ececf1;
    --muted: #a1a1ae;
    --dim: #77778a;
    --accent: #8b88f8;
    --accent-2: #aaa8ff;
    --accent-dim: rgba(139, 136, 248, 0.14);
    --radius: 16px;
    --maxw: 1120px;
    --header-h: 64px;
  }

  * { box-sizing: border-box; }

  /* Тёмный canvas задан до первой отрисовки; межстраничный View Transition не используется,
     чтобы возврат на главную не создавал промежуточный светлый кадр. */
  html { background: var(--bg); color-scheme: dark; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  a { color: var(--accent-2); text-decoration: none; }
  a:hover { text-decoration: underline; }
  /* height: auto обязателен: у снимков проставлены атрибуты width/height (чтобы
     место под них резервировалось до загрузки), а они действуют как presentational
     hint и без этого фиксируют высоту, отменяя aspect-ratio в галерее. */
  img { max-width: 100%; height: auto; display: block; }

  .wrap { width: 100%; max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(11, 11, 15, 0.82);
    backdrop-filter: saturate(160%) blur(14px);
    border-bottom: 1px solid var(--line);
    transition: box-shadow .25s ease, background .25s ease;
  }
  /* Класс ставит JS, когда страница прокручена: шапка отделяется тенью. */
  header.stuck {
    background: rgba(11, 11, 15, 0.92);
    box-shadow: 0 10px 30px -22px rgba(0, 0, 0, 1);
  }

  /* ---------- кнопка «наверх» ---------- */

  .to-top {
    position: fixed;
    right: 22px;
    bottom: 22px;
    z-index: 20;
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid var(--line-strong);
    background: rgba(23, 23, 29, 0.86);
    backdrop-filter: blur(10px);
    color: var(--text);
    cursor: pointer;
    opacity: 0;
    transform: translateY(12px) scale(.9);
    pointer-events: none;
    transition: opacity .25s ease, transform .25s cubic-bezier(.22, .8, .3, 1), border-color .18s ease;
  }
  .to-top.show { opacity: 1; transform: none; pointer-events: auto; }
  .to-top:hover { border-color: rgba(139, 136, 248, 0.5); }
  .to-top:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .to-top svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .to-top:hover svg { animation: nudge .5s ease; }
  @keyframes nudge {
    50% { transform: translateY(-3px); }
  }

  .nav { display: flex; align-items: center; gap: 20px; height: var(--header-h); }
  .brand {
    display: flex;
    align-items: center;
    gap: 11px;
    font-weight: 600;
    color: var(--text);
    margin-right: auto;
  }
  .brand:hover { text-decoration: none; }
  .brand img {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    transition: transform .3s cubic-bezier(.22, .8, .3, 1);
  }
  .brand:hover img { transform: rotate(-8deg) scale(1.08); }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 9px 16px;
    border-radius: 11px;
    font-size: 14px;
    font-weight: 550;
    border: 1px solid var(--line-strong);
    color: var(--text);
    background: rgba(255, 255, 255, 0.03);
    white-space: nowrap;
    transition: background .18s ease, border-color .18s ease, transform .18s ease;
  }
  .btn:hover {
    background: rgba(255, 255, 255, 0.07);
    border-color: rgba(255, 255, 255, 0.3);
    transform: translateY(-1px);
    text-decoration: none;
  }
  .btn-primary {
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, #8f8cfa, #6f6ce4);
    border-color: transparent;
    color: #0d0d14;
    box-shadow: 0 8px 24px -10px rgba(126, 122, 240, 0.9);
    transition: filter .18s ease, transform .18s ease, box-shadow .18s ease;
  }
  .btn-primary:hover {
    filter: brightness(1.07);
    background: linear-gradient(180deg, #8f8cfa, #6f6ce4);
    border-color: transparent;
    transform: translateY(-1px);
    box-shadow: 0 14px 30px -12px rgba(126, 122, 240, 1);
  }
  .btn-primary:active { transform: translateY(0); }
  /* Блик пробегает по кнопке при наведении — как на главной. */
  .btn-primary::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: -60%;
    width: 45%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.45), transparent);
    transform: skewX(-18deg);
    opacity: 0;
  }
  .btn-primary:hover::after { animation: sheen .75s ease-out; }
  @keyframes sheen {
    0% { left: -60%; opacity: 0; }
    15% { opacity: 1; }
    100% { left: 120%; opacity: 0; }
  }
  /* Логотип Apple — сплошная заливка, а не обводка. */
  .btn svg.apple { width: 13px; height: 16px; fill: currentColor; stroke: none; margin-top: -2px; }

  /* Сверху свечение обрезается, а справа может естественно уйти за край. */
  .intro {
    position: relative;
    padding: 56px 0 28px;
    overflow: visible;
    clip-path: inset(0 -100vw);
  }
  /* Правый край остаётся на прежнем месте, а увеличенная ширина растягивает
     подсветку влево примерно на две трети блока. */
  .intro::before {
    content: "";
    position: absolute;
    top: -280px;
    right: -160px;
    width: min(100%, 1040px);
    height: 560px;
    background: radial-gradient(closest-side, rgba(129, 125, 240, 0.22), transparent);
    pointer-events: none;
    z-index: 0;
    will-change: transform, opacity;
    animation: aurora 9s cubic-bezier(.45, 0, .55, 1) infinite;
  }
  /* Текст поднимаем над свечением: абсолютный ::before иначе рисуется поверх. */
  .intro > * { position: relative; z-index: 1; }

  /* Та же частица, что на главной: мягкий световой туман без хвоста и без
     чёткой круглой границы. */
  .ambient-particle {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 9;
    width: 56px;
    height: 56px;
    margin-left: -28px;
    margin-top: -28px;
    border-radius: 58% 42% 63% 37% / 46% 54% 46% 54%;
    background:
      radial-gradient(45% 42% at 38% 40%, rgba(236, 232, 255, .55) 0%, rgba(186, 176, 255, .22) 42%, transparent 72%),
      radial-gradient(38% 40% at 62% 58%, rgba(148, 136, 248, .28) 0%, transparent 70%),
      radial-gradient(55% 50% at 52% 48%, rgba(120, 108, 235, .12) 0%, transparent 78%);
    filter: blur(5px) saturate(1.08);
    mix-blend-mode: screen;
    opacity: 0;
    pointer-events: none;
    will-change: transform, opacity, filter;
    transition: opacity .4s cubic-bezier(.2,0,.3,1), filter .4s ease;
    animation: particle-morph 7.2s ease-in-out infinite alternate;
  }
  .ambient-particle::before {
    content: "";
    position: absolute;
    left: 8px;
    top: 10px;
    width: 28px;
    height: 26px;
    border-radius: 48% 52% 41% 59% / 55% 42% 58% 45%;
    background: radial-gradient(ellipse at 50% 45%, rgba(255, 252, 255, .42), rgba(198, 190, 255, .16) 48%, transparent 78%);
    filter: blur(3px);
    animation: particle-breathe 4.2s ease-in-out infinite alternate;
  }
  .ambient-particle::after {
    content: "";
    position: absolute;
    right: 4px;
    bottom: 6px;
    width: 24px;
    height: 22px;
    border-radius: 61% 39% 52% 48% / 43% 57% 43% 57%;
    background: radial-gradient(ellipse at 45% 50%, rgba(157, 145, 250, .26), transparent 74%);
    filter: blur(5.5px);
    animation: particle-drift 5.4s ease-in-out infinite alternate;
  }
  .ambient-particle.is-moving { opacity: .72; }

  @keyframes particle-morph {
    from { border-radius: 58% 42% 63% 37% / 46% 54% 46% 54%; }
    to { border-radius: 41% 59% 38% 62% / 57% 40% 60% 43%; }
  }
  @keyframes particle-breathe {
    from { opacity: .55; transform: translate(-2px, 3px) scale(.88); }
    to { opacity: 1; transform: translate(3px, -2px) scale(1.12); }
  }
  @keyframes particle-drift {
    from { opacity: .4; transform: translate(2px, -3px) scale(.9); }
    to { opacity: .85; transform: translate(-3px, 2px) scale(1.18); }
  }

  /* Прозрачность при пролёте над блоками с контентом: частица становится едва заметной, чтобы не мешать чтению */
  .ambient-particle.is-dimmed {
    opacity: .08 !important;
    filter: blur(7px) saturate(.8);
  }

  /* Рядом с курсором пятно чуть ярче, но остаётся мягким. */
  .ambient-particle.is-near-cursor {
    opacity: .86;
    filter: blur(4px) saturate(1.22) drop-shadow(0 0 8px rgba(159, 146, 255, .32));
  }
  .ambient-particle.is-impulsed {
    filter: blur(3.5px) saturate(1.35) drop-shadow(0 0 12px rgba(181, 170, 255, .4));
  }

  @keyframes aurora {
    0%, 100% { opacity: .62; transform: scale(.94); }
    50% { opacity: 1; transform: scale(1.16); }
  }

  /* Появление шапки страницы: элементы въезжают по очереди. */
  .intro .eyebrow, .intro h1, .intro .lede {
    animation: rise .8s cubic-bezier(.22, .8, .3, 1) both;
  }
  .intro h1 { animation-delay: .08s; }
  .intro .lede { animation-delay: .16s; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: none; }
  }

  .eyebrow {
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    margin: 0 0 12px;
  }
  h1 {
    margin: 0 0 12px;
    font-size: clamp(30px, 4.4vw, 42px);
    line-height: 1.14;
    letter-spacing: -0.022em;
    font-weight: 660;
  }
  .lede { margin: 0; max-width: 68ch; color: var(--muted); font-size: 17px; }

  .gallery {
    display: grid;
    gap: 20px;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    padding-bottom: 80px;
  }

  .gallery button {
    display: block;
    position: relative;
    width: 100%;
    padding: 0;
    text-align: left;
    font: inherit;
    color: inherit;
    cursor: zoom-in;
    border: 1px solid var(--line);
    border-radius: 13px;
    background: var(--panel);
    overflow: hidden;
    transition: border-color .28s cubic-bezier(.22, .61, .36, 1), transform .28s cubic-bezier(.22, .61, .36, 1);
  }
  .gallery button:hover {
    border-color: rgba(139, 136, 248, 0.4);
    transform: translateY(-4px);
    box-shadow: 0 22px 46px -30px rgba(0, 0, 0, 1);
  }
  .gallery button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .gallery img {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    object-position: top center;
    background: #0a0a0e;
    border-bottom: 1px solid var(--line);
  }
  /* Вертикальные диалоги (онбординг, AI Setup): cover обрезал бы нижние
     провайдеры и поле ключа. contain показывает окно целиком. */
  .gallery img.shot-tall {
    object-fit: contain;
    object-position: center;
  }

  /* Подсказка «открыть» выезжает поверх снимка при наведении. */
  .gallery .zoom {
    position: absolute;
    right: 10px;
    top: 10px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 11px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: rgba(11, 11, 15, 0.72);
    backdrop-filter: blur(8px);
    color: var(--text);
    font-size: 12.5px;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .22s ease, transform .22s ease;
    pointer-events: none;
  }
  .gallery button:hover .zoom,
  .gallery button:focus-visible .zoom { opacity: 1; transform: none; }

  .gallery .meta { padding: 15px 17px 17px; }
  .gallery .meta b {
    display: block;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 5px;
    transition: color .2s ease;
  }
  .gallery button:hover .meta b { color: var(--accent-2); }
  .gallery .meta span { color: var(--dim); font-size: 14px; line-height: 1.5; }

  /* ---------- каскад появления галереи ---------- */

  /* Без html.js-cascade (нет JS / reduce) плитки сразу в финальном виде.
     С классом — прячем только «ещё не вошедшие»; is-shown / каскад снят
     → обычные стили кнопки и hover снова работают без борьбы селекторов.
     Анимация keyframes, не transition: hover у кнопки тогда не конфликтует. */
  html.js-cascade #gallery button:not(.cascade-in):not(.is-shown) {
    opacity: 0;
    transform: translateY(22px) scale(.99);
  }
  html.js-cascade #gallery button.cascade-in {
    animation: reveal-in .65s cubic-bezier(.22, .8, .3, 1) var(--d, 0s) both;
  }
  @keyframes reveal-in {
    from { opacity: 0; transform: translateY(22px) scale(.99); }
    to { opacity: 1; transform: none; }
  }

  /* ---------- lightbox ---------- */

  dialog.lightbox {
    width: min(96vw, 1500px);
    max-width: 96vw;
    /* Высота фиксированная, а не max-height: иначе высота .lb-body
       неопределённая и max-height:100% у картинки игнорируется —
       высокий скриншот вылезает под подпись. */
    height: 94vh;
    max-height: 94vh;
    padding: 0;
    border: 1px solid var(--line-strong);
    border-radius: 16px;
    background: var(--bg-soft);
    color: var(--text);
    overflow: hidden;
  }
  /* Колонка: картинка отдаёт высоту подписи, а не выдавливает её
     за границу диалога — иначе при подписи в две строки низ обрезается. */
  dialog.lightbox[open] { display: flex; flex-direction: column; }
  dialog.lightbox::backdrop { background: rgba(6, 6, 9, 0.86); }

  /* Появление и закрытие: диалог всплывает, подложка проявляется.
     allow-discrete + @starting-style нужны, чтобы анимировался и display.
     Открытие длиннее и мягче закрытия — так движение не выглядит рывком. */
  dialog.lightbox {
    opacity: 0;
    transform: scale(.985) translateY(6px);
    transition:
      opacity .18s cubic-bezier(.4, 0, 1, 1),
      transform .18s cubic-bezier(.4, 0, 1, 1),
      overlay .18s allow-discrete,
      display .18s allow-discrete;
    will-change: opacity, transform;
  }
  dialog.lightbox[open] {
    opacity: 1;
    transform: none;
    transition:
      opacity .34s cubic-bezier(.22, .61, .36, 1),
      transform .34s cubic-bezier(.22, .61, .36, 1),
      overlay .34s allow-discrete,
      display .34s allow-discrete;
  }
  @starting-style {
    dialog.lightbox[open] { opacity: 0; transform: scale(.985) translateY(6px); }
  }
  dialog.lightbox::backdrop {
    opacity: 0;
    transition: opacity .18s ease, overlay .18s allow-discrete, display .18s allow-discrete;
  }
  dialog.lightbox[open]::backdrop {
    opacity: 1;
    transition: opacity .34s ease, overlay .34s allow-discrete, display .34s allow-discrete;
  }
  @starting-style {
    dialog.lightbox[open]::backdrop { opacity: 0; }
  }

  .lb-bar {
    display: flex;
    flex: 0 0 auto;
    align-items: center;
    gap: 14px;
    padding: 12px 14px 12px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .lb-title { font-size: 15px; font-weight: 600; margin-right: auto; }
  .lb-count { color: var(--dim); font-size: 13.5px; font-variant-numeric: tabular-nums; }

  .lb-btn {
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    border-radius: 9px;
    border: 1px solid var(--line-strong);
    background: rgba(255, 255, 255, 0.03);
    color: var(--text);
    cursor: pointer;
  }
  .lb-btn:hover { background: rgba(255, 255, 255, 0.09); }
  .lb-btn:disabled { opacity: .35; cursor: default; }
  /* Кликом фокус липнет на «первой нажатой» стрелке — обводку только с Tab. */
  .lb-btn:focus { outline: none; }
  .lb-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .lb-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* shellFocus() — без UA-рамки вокруг всего окна */
  dialog.lightbox:focus { outline: none; }

  .lb-body {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    /* Слои абсолютны: иначе intrinsic-высота вертикального PNG
       (онбординг/AI Setup) раздувала body и подпись «залазила» на кадр. */
    background: #0a0a0e;
    overflow: hidden;
  }
  .lb-body img {
    position: absolute;
    inset: 16px;
    width: calc(100% - 32px);
    height: calc(100% - 32px);
    margin: auto;
    object-fit: contain;
    border-radius: 8px;
    /* Кадр в покое стоит за краем области и скрыт overflow'ом родителя. */
    opacity: 0;
    transform: translateX(var(--lb-shift, 100vw));
    transition:
      transform .46s cubic-bezier(.32, .72, 0, 1),
      opacity .46s cubic-bezier(.32, .72, 0, 1);
    will-change: transform;
  }
  /* Оба кадра едут одновременно и с одинаковой скоростью: уходящий за край,
     входящий с противоположной стороны — это и есть сдвиг ленты. */
  .lb-body img.is-active,
  .lb-body img.is-entering,
  .lb-body img.is-leaving { opacity: 1; }
  .lb-body img.is-active { transform: translateX(0); }
  .lb-body img.is-entering.from-right { transform: translateX(var(--lb-shift, 100vw)); }
  .lb-body img.is-entering.from-left { transform: translateX(calc(-1 * var(--lb-shift, 100vw))); }
  .lb-body img.is-leaving.to-left { transform: translateX(calc(-1 * var(--lb-shift, 100vw))); }
  .lb-body img.is-leaving.to-right { transform: translateX(var(--lb-shift, 100vw)); }
  /* Стартовое положение входящего кадра выставляется без анимации. */
  .lb-body img.no-anim { transition: none; }

  .lb-title,
  .lb-caption {
    transition: opacity .18s ease;
  }
  .lb-bar.is-swapping .lb-title,
  .lb-caption.is-swapping { opacity: 0; }

  .lb-caption {
    /* Отдельная полоса под flex-колонкой: не сжимается и не перекрывается кадром. */
    flex: 0 0 auto;

    background: var(--panel);

  }

  @media (max-width: 720px) {
    .intro { padding-top: 40px; }
    .lb-title { font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ambient-particle { display: none; }
    .gallery button { transition: none; }
    .gallery button:hover { transform: none; }
    .gallery .zoom, .gallery .meta b { transition: none; }
    .intro::before, .intro .eyebrow, .intro h1, .intro .lede { animation: none; }

    .btn, .btn-primary { transition: none; }

    dialog.lightbox,

    dialog.lightbox { opacity: 1; transform: none; }
    .lb-body img { transition: none; }
    .lb-body img.is-active { transform: none; }
    .lb-title, .lb-caption { transition: none; }
  }
</style>

    <img class="lb-layer" src="" alt="" aria-hidden="true">
  </div>

</dialog>

<script src="ambient-particle-flags.js"></script>
<script>
  (function () {
    var items = Array.prototype.slice.call(
      document.querySelectorAll('#gallery button')
    );
    var dialog = document.getElementById('lightbox');
    var layers = Array.prototype.slice.call(document.querySelectorAll('.lb-layer'));
    var bar = document.getElementById('lb-bar');
    var title = document.getElementById('lb-title');
    var caption = document.getElementById('lb-caption');
    var count = document.getElementById('lb-count');
    var prev = document.getElementById('lb-prev');
    var next = document.getElementById('lb-next');
    var body = document.getElementById('lb-body');
    var current = 0;
    var active = 0;
    var token = 0;
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)');

    // Дистанция сдвига — ширина области просмотра: кадр уезжает ровно за край.
    function updateShift() {
      // У закрытого диалога ширина нулевая — прежнее значение лучше нуля.
      if (!body.clientWidth) return;
      body.style.setProperty('--lb-shift', body.clientWidth + 'px');
    }
    window.addEventListener('resize', updateShift);

    // Декодируем снимок заранее: подмена src без этого даёт вспышку и
    // скачок размера, пока картинка догружается.
    function preload(index) {
      if (index < 0 || index >= items.length) return null;
      var loader = new Image();
      loader.src = items[index].getAttribute('data-src');
      return loader;
    }

    function applyText(item, index) {
      title.textContent = item.getAttribute('data-title');
      caption.textContent = item.getAttribute('data-caption');
      count.textContent = (index + 1) + ' / ' + items.length;
    }

    // Зацикливание: с первого — на последний и наоборот. direction: +1 / −1.
    function wrap(index) {
      var n = items.length;
      return ((index % n) + n) % n;
    }

    function go(direction) {
      if (!items.length) return;
      show(wrap(current + direction), direction);
    }

    function show(index, direction) {
      if (index < 0 || index >= items.length) return;
      var item = items[index];
      var src = item.getAttribute('data-src');
      var incoming = layers[1 - active];
      var outgoing = layers[active];
      var mine = ++token;
      current = index;

      if (!direction || reduced.matches) {
        // Первое открытие: показываем сразу в активном слое, без перехода.
        outgoing.className = 'lb-layer';
        incoming.src = src;
        incoming.alt = item.getAttribute('data-title');
        incoming.className = 'lb-layer no-anim is-active';
        void incoming.offsetWidth;
        incoming.className = 'lb-layer is-active';
        outgoing.setAttribute('aria-hidden', 'true');
        incoming.removeAttribute('aria-hidden');
        active = 1 - active;
        applyText(item, index);
        updateShift();
        preload(wrap(index + 1));
        preload(wrap(index - 1));
        return;
      }

      // Подписи гасим на время подмены, чтобы текст не «прыгал» раньше кадра.
      bar.classList.add('is-swapping');
      caption.classList.add('is-swapping');

      var loader = new Image();
      loader.src = src;
      var ready = loader.decode ? loader.decode().catch(function () {}) : Promise.resolve();

      ready.then(function () {
        if (mine !== token) return;
        var side = direction > 0 ? 'from-right' : 'from-left';
        var away = direction > 0 ? 'to-left' : 'to-right';

        incoming.src = src;
        incoming.alt = item.getAttribute('data-title');
        // Ставим входящий кадр за край без анимации…
        incoming.className = 'lb-layer no-anim is-entering ' + side;
        // …форсируем reflow, иначе старт и финиш схлопнутся в один кадр…
        void incoming.offsetWidth;
        // …и запускаем оба кадра в одном кадре отрисовки — лента едет целиком.
        incoming.className = 'lb-layer is-entering is-active';
        outgoing.className = 'lb-layer is-leaving ' + away;
        outgoing.setAttribute('aria-hidden', 'true');
        incoming.removeAttribute('aria-hidden');

        active = 1 - active;
        applyText(item, index);
        bar.classList.remove('is-swapping');
        caption.classList.remove('is-swapping');
        preload(wrap(index + direction));
      });
    }

    // Фокус «оболочки» dialog: стрелки с клавиатуры работают, а кнопки bar
    // не остаются с :focus после клика / showModal (липнет та, что первой).
    function shellFocus() {
      if (!dialog.open) return;
      dialog.focus({ preventScroll: true });
    }

    function openAt(index) {
      if (!dialog.open) dialog.showModal();
      show(index);
      shellFocus();
      // showModal-фокус может сдвинуть activeElement чуть позже.
      queueMicrotask(shellFocus);
    }

    items.forEach(function (item, index) {
      item.addEventListener('click', function () {
        // Сначала открываем: у закрытого диалога нет ширины, а она нужна
        // для расчёта дистанции сдвига.
        openAt(index);
      });
    });

    prev.addEventListener('click', function () {
      go(-1);
      shellFocus();
    });
    next.addEventListener('click', function () {
      go(1);
      shellFocus();
    });
    document.getElementById('lb-close').addEventListener('click', function () {
      dialog.close();
    });

    // Слушаем document: надёжнее, чем только dialog — стрелки работают сразу,
    // даже если фокус ещё не внутри (и после клика по картинке).
    document.addEventListener('keydown', function (event) {
      if (!dialog.open) return;
      if (event.key === 'ArrowRight') { event.preventDefault(); go(1); }
      if (event.key === 'ArrowLeft') { event.preventDefault(); go(-1); }
    });

    // Клик по подложке вокруг картинки закрывает окно.
    dialog.addEventListener('click', function (event) {
      if (event.target === dialog) dialog.close();
    });

    // После Esc/close UA возвращает фокус на плитку-открыватель.
    // Раз закрытие с клавиатуры, :focus-visible оставляет обводку и «Открыть».
    // Снимаем фокус после restore (он может быть чуть позже close).
    dialog.addEventListener('close', function () {
      queueMicrotask(function () {
        var el = document.activeElement;
        if (el && items.indexOf(el) !== -1) el.blur();
      });
    });

    // Переход с лендинга по ссылке вида screens.html#shot-06 — открываем
    // именно этот снимок в полном размере, а не просто страницу галереи.
    function openFromHash() {
      var id = window.location.hash.slice(1);
      if (!id) return;
      var index = -1;
      items.forEach(function (item, i) { if (item.id === id) index = i; });
      if (index < 0) return;
      openAt(index);
    }
    window.addEventListener('hashchange', openFromHash);
    openFromHash();
  })();

  // Тень у шапки и кнопка «наверх» зависят от одной величины,
  // поэтому считаем их в одном обработчике.
  (function () {
    var header = document.querySelector('header');

    var toTop = document.createElement('button');
    toTop.type = 'button';
    toTop.className = 'to-top';
    toTop.setAttribute('aria-label', 'Наверх');
    toTop.innerHTML =
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6"/><path d="M6 11.5L12 5.5l6 6"/></svg>';
    toTop.addEventListener('click', function () {
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' });
    });
    document.body.appendChild(toTop);

    var ticking = false;

    function update() {
      var y = window.scrollY;

      if (header) header.classList.toggle('stuck', y > 8);
      toTop.classList.toggle('show', y > window.innerHeight * 0.9);
    }

    window.addEventListener('scroll', function () {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () {
        update();
        ticking = false;
      });
    }, { passive: true });
    window.addEventListener('resize', update);
    update();
  })();

  // Подсказка «Открыть» в углу снимка. Рисуем из JS: без скрипта лайтбокс
  // всё равно не работает, и подсказка обещала бы несуществующее действие.
  (function () {
    var cards = document.querySelectorAll('#gallery button');
    Array.prototype.forEach.call(cards, function (card) {
      var hint = document.createElement('span');
      hint.className = 'zoom';
      hint.setAttribute('aria-hidden', 'true');
      hint.innerHTML =
        '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" ' +
        'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
        '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6M11 8.5v5M8.5 11h5"/></svg>Открыть';
      card.appendChild(hint);
    });
  })();

  // Каскад плиток при скролле. Прячем через html.js-cascade (head);
  // здесь только задержки соседей и запуск keyframes.
  (function () {
    if (!document.documentElement.classList.contains('js-cascade')) return;
    if (!('IntersectionObserver' in window)) {
      // Класс стоит, а IO нет — иначе сетка останется невидимой.
      document.documentElement.classList.remove('js-cascade');
      return;
    }

    var cards = Array.prototype.slice.call(
      document.querySelectorAll('#gallery button')
    );
    if (!cards.length) return;

    var gallery = document.getElementById('gallery');

    var io = new IntersectionObserver(function (entries) {
      // Один «залёт» в вид: соседние плитки — ступеньками по --d.
      var wave = entries
        .filter(function (entry) { return entry.isIntersecting; })
        .map(function (entry) { return entry.target; })
        .sort(function (a, b) {
          return cards.indexOf(a) - cards.indexOf(b);
        });

      wave.forEach(function (card, i) {
        card.style.setProperty('--d', Math.min(i, 4) * 0.08 + 's');
        card.classList.add('cascade-in');
        io.unobserve(card);
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });

    cards.forEach(function (card) { io.observe(card); });

    // После каскада: is-shown + снимаем cascade-in, иначе fill-mode
    // держит transform и ломает hover-подъём.
    gallery.addEventListener('animationend', function (event) {
      if (event.animationName !== 'reveal-in') return;
      var card = event.target;
      if (!card || card.tagName !== 'BUTTON') return;
      card.classList.remove('cascade-in');
      card.classList.add('is-shown');
      card.style.removeProperty('--d');
    });
  })();

  // Частица движется по плавной неповторяющейся кривой поверх всей страницы.
  // Координаты — в пространстве документа: при скролле пятно уезжает вместе со страницей,
  // а не «висит» в viewport. Становится прозрачной над контентом и реагирует на мышь.
  // Флаги ENABLE_* — в ambient-particle-flags.js, ключ 'screens' (отдельно от index).
  (function () {
    var particleFlags = getLandingParticleFlags('screens');
    var ENABLE_AMBIENT_PARTICLE = particleFlags.ENABLE_AMBIENT_PARTICLE;
    var ENABLE_HOVER_ATTRACTION = particleFlags.ENABLE_HOVER_ATTRACTION;
    var particle = document.querySelector('.ambient-particle');
    if (!ENABLE_AMBIENT_PARTICLE) {
      if (particle) particle.remove();
      return;
    }
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (!particle) return;

    // pageX/pageY — позиция в документе; viewX/viewY — в viewport для fixed-transform.
    var pageX;
    var pageY;
    var viewX;
    var viewY;
    var heading = Math.PI * 1.08; // от правого края — влево по странице
    var speed = 70;
    var last = 0;
    var margin = 40;
    var phaseA = Math.random() * Math.PI * 2;
    var phaseB = Math.random() * Math.PI * 2;
    var phaseC = Math.random() * Math.PI * 2;

    // Интерактивность: отслеживание курсора мыши и кликов
    var mouseX = -1000;
    var mouseY = -1000;
    var clickImpulseTime = -Infinity;
    var clickDirection = heading;
    var clickPhase = null;
    var hoverSuppressedUntil = 0;
    var isHoverCaptured = false;
    // После клика курсор не перехватывает, пока частица не улетит достаточно далеко.
    var flightLockedAfterClick = false;
    var clickStartTime = -Infinity;
    // Чередуем вверх/вниз между кликами — строго 50/50, без «всегда вверх» по ощущению.
    var nextVerticalUp = Math.random() < .5;
    var contentZoneSelector = '.intro, .gallery button, .lightbox, footer .inner';

    function getVisibleContentRects() {
      var zones = document.querySelectorAll(contentZoneSelector);
      var rects = [];
      for (var i = 0; i < zones.length; i += 1) {
        var rect = zones[i].getBoundingClientRect();
        if (!rect.width || !rect.height ||
            rect.right <= 0 || rect.left >= window.innerWidth ||
            rect.bottom <= 0 || rect.top >= window.innerHeight) continue;
        rects.push(rect);
      }
      return rects;
    }

    function pointIsOverContent(px, py) {
      var rects = getVisibleContentRects();
      for (var i = 0; i < rects.length; i += 1) {
        var r = rects[i];
        if (px >= r.left && px <= r.right && py >= r.top && py <= r.bottom) return true;
      }
      return false;
    }

    // Примерно влево или вправо — к ближайшему выходу из контента по горизонтали.
    // Не строго: добавляем небольшой случайный наклон.
    function getHorizontalEscapeDirection(px, py) {
      var rects = getVisibleContentRects();
      var leftEdge = Infinity;
      var rightEdge = -Infinity;
      var covered = false;
      var i;

      for (i = 0; i < rects.length; i += 1) {
        var rect = rects[i];
        if (py < rect.top || py > rect.bottom) continue;
        covered = true;
        leftEdge = Math.min(leftEdge, rect.left);
        rightEdge = Math.max(rightEdge, rect.right);
      }

      var goRight;
      if (covered && px >= leftEdge && px <= rightEdge) {
        goRight = (rightEdge - px) <= (px - leftEdge);
      } else if (covered) {
        goRight = px < (leftEdge + rightEdge) / 2;
      } else {
        goRight = px < window.innerWidth / 2;
      }

      // ~±7° wobble so the path is not a straight line.
      var wobble = (Math.random() - .5) * .24;
      return (goRight ? 0 : Math.PI) + wobble;
    }

    function getVerticalWanderDirection() {
      // Строго 50/50 за счёт чередования направлений между кликами.
      var up = nextVerticalUp;
      nextVerticalUp = !nextVerticalUp;
      var base = up ? -Math.PI / 2 : Math.PI / 2;
      // Небольшой боковой уклон, без перевеса вверх.
      var wobble = (Math.random() - .5) * .28;
      return base + wobble;
    }

    function applyClickImpulse(delta, progress) {
      // Мягкий ease-in-out: разгон растёт без рывка, но держит крейсерскую скорость.
      var t = Math.min(1, Math.max(0, progress));
      var clickEase = t * t * (3 - 2 * t);
      // Минимум ~92: сразу есть уход от курсора; пик ~150.
      var clickTargetSpeed = 92 + clickEase * 58;
      var currentClickX = Math.cos(heading) * speed;
      var currentClickY = Math.sin(heading) * speed;
      var targetClickX = Math.cos(clickDirection) * clickTargetSpeed;
      var targetClickY = Math.sin(clickDirection) * clickTargetSpeed;
      var clickBlend = Math.min(1, delta * 1.5 * (.18 + clickEase * .7));
      var clickVelocityX = currentClickX + (targetClickX - currentClickX) * clickBlend;
      var clickVelocityY = currentClickY + (targetClickY - currentClickY) * clickBlend;

      heading = Math.atan2(clickVelocityY, clickVelocityX);
      speed = Math.sqrt(clickVelocityX * clickVelocityX + clickVelocityY * clickVelocityY);
    }

    function syncViewFromPage() {
      viewX = pageX - window.scrollX;
      viewY = pageY - window.scrollY;
    }

    function wrapInViewport() {
      var viewW = window.innerWidth;
      var viewH = window.innerHeight;
      if (viewX < -margin) {
        viewX = viewW + margin;
        pageX = window.scrollX + viewX;
      } else if (viewX > viewW + margin) {
        viewX = -margin;
        pageX = window.scrollX + viewX;
      }
      if (viewY < -margin) {
        viewY = viewH + margin;
        pageY = window.scrollY + viewY;
      } else if (viewY > viewH + margin) {
        viewY = -margin;
        pageY = window.scrollY + viewY;
      }
    }

    window.addEventListener('pointermove', function (e) {
      mouseX = e.clientX;
      mouseY = e.clientY;
    }, { passive: true });

    window.addEventListener('pointerleave', function () {
      mouseX = -1000;
      mouseY = -1000;
      isHoverCaptured = false;
    });

    window.addEventListener('click', function (event) {
      if (pageX === undefined || pageY === undefined) return;
      syncViewFromPage();
      var clickX = event.clientX - viewX;
      var clickY = event.clientY - viewY;
      var clickDist = Math.sqrt(clickX * clickX + clickY * clickY);
      // Клик по частице — по близости; при вкл. притяжении ещё нужен «захват».
      if (clickDist > 76) return;
      if (ENABLE_HOVER_ATTRACTION && !isHoverCaptured) return;

      // Сначала примерно влево/вправо из контента, затем случайно вверх/вниз.
      clickPhase = 'out';
      clickDirection = getHorizontalEscapeDirection(viewX, viewY);
      clickImpulseTime = performance.now();
      clickStartTime = clickImpulseTime;
      // Курсор не ловит, пока не прошло время И частица не отошла далеко.
      hoverSuppressedUntil = clickImpulseTime + 5200;
      flightLockedAfterClick = true;
      isHoverCaptured = false;
    }, { passive: true });

    function move(time) {
      if (pageX === undefined) {
        // Галерея экранов: появление справа посередине.
        pageX = window.scrollX + window.innerWidth * .88;
        pageY = window.scrollY + window.innerHeight * .5;
      }

      if (!last) last = time;
      var delta = Math.min((time - last) / 1000, .05);
      last = time;

      // pageX/pageY — document-space; view* = page* − scroll* (fixed-layer).
      // При скролле page* не двигаем — пятно уезжает вместе со страницей.
      syncViewFromPage();

      var seconds = time / 1000;
      var clickProgress = (time - clickImpulseTime) / 1800;
      var isClickActive = clickPhase !== null;
      var dx = mouseX - viewX;
      var dy = mouseY - viewY;
      var mouseDist = Math.sqrt(dx * dx + dy * dy);

      // Снимаем блок только после ухода от курсора (≥300px) и не раньше suppress-таймера.
      // ENABLE_HOVER_ATTRACTION = false — захват и follow заглушены, код остаётся.
      if (!ENABLE_HOVER_ATTRACTION) {
        isHoverCaptured = false;
      } else if (flightLockedAfterClick) {
        isHoverCaptured = false;
        if (
          time >= hoverSuppressedUntil &&
          mouseDist >= 300 &&
          clickPhase === null
        ) {
          flightLockedAfterClick = false;
        }
        // Жёсткий потолок, если курсор «едет» за частицей.
        if (time - clickStartTime > 7000) {
          flightLockedAfterClick = false;
        }
      } else if (isClickActive || time < hoverSuppressedUntil) {
        isHoverCaptured = false;
      } else if (mouseDist < 170) {
        isHoverCaptured = true;
      } else if (mouseDist > 240) {
        isHoverCaptured = false;
      }
      var isNear = ENABLE_HOVER_ATTRACTION && isHoverCaptured && !flightLockedAfterClick;

      if (clickPhase === 'out') {
        applyClickImpulse(delta, Math.min(clickProgress, .95));

        // После выхода на свободную зону — плавно поворачиваем вверх или вниз (50/50).
        // Дольше держим горизонтальный разгон, чтобы уйти от курсора.
        if (time - clickImpulseTime > 520 && !pointIsOverContent(viewX, viewY)) {
          clickPhase = 'turn';
          clickDirection = getVerticalWanderDirection();
          clickImpulseTime = time;
        } else if (time - clickImpulseTime > 2400) {
          // Подстраховка: если долго не вышли — всё равно начинаем вертикальный дрейф.
          clickPhase = 'turn';
          clickDirection = getVerticalWanderDirection();
          clickImpulseTime = time;
        }
      } else if (clickPhase === 'turn') {
        applyClickImpulse(delta, Math.min((time - clickImpulseTime) / 1400, 1));
        if (time - clickImpulseTime > 1400) {
          clickPhase = null;
        }
      } else if (isNear) {
        // Под курсором частица следует за медленно меняющейся хаотичной целью.
        // Демпфирование гасит инерцию и не даёт ей вращаться вокруг указателя.
        var hoverX =
          mouseX +
          Math.sin(seconds * 1.17 + phaseA) * 10 +
          Math.sin(seconds * .53 + phaseC) * 5;
        var hoverY =
          mouseY +
          Math.sin(seconds * .91 + phaseB) * 8 +
          Math.cos(seconds * .47 + phaseA) * 5;
        // Скорость в screen-space → применяем к page-space (одинаковый шаг).
        var desiredX = (hoverX - viewX) * 3.2;
        var desiredY = (hoverY - viewY) * 3.2;
        var desiredSpeed = Math.sqrt(desiredX * desiredX + desiredY * desiredY);
        if (desiredSpeed > 105) {
          desiredX = desiredX / desiredSpeed * 105;
          desiredY = desiredY / desiredSpeed * 105;
        }

        var currentX = Math.cos(heading) * speed;
        var currentY = Math.sin(heading) * speed;
        var follow = Math.min(1, delta * 4.2);
        currentX += (desiredX - currentX) * follow;
        currentY += (desiredY - currentY) * follow;
        heading = Math.atan2(currentY, currentX);
        speed = Math.sqrt(currentX * currentX + currentY * currentY);
      } else {
        var turnRate =
          Math.sin(seconds * .37 + phaseA) * .22 +
          Math.sin(seconds * .73 + phaseB) * .11 +
          Math.sin(seconds * .11 + phaseC) * .06;
        var targetSpeed = 70 + Math.sin(seconds * .29 + phaseB) * 9;

        heading += turnRate * delta;
        speed += (targetSpeed - speed) * Math.min(1, delta * 1.4);
      }

      // Полёт в document-space: страница уезжает, pageX/Y держат точку на документе.
      pageX += Math.cos(heading) * speed * delta;
      pageY += Math.sin(heading) * speed * delta;
      syncViewFromPage();
      wrapInViewport();

      // Определение нахождения частицы над зонами с контентом (чтобы сделать её прозрачнее)
      var elem = document.elementFromPoint(viewX, viewY);
      var overContent = false;
      if (elem) {
        var contentBlock = elem.closest(
          '.card, .hero-grid, .hero-visual, .showcase, .showcase-card, .feature-card, ' +
          '.features, .steps, .step, .faq, .faq-item, .field-details, .mapping-grid, ' +
          '.metadata-orbit, .metadata-delivery, .thumbs, .thumb-card, .intro-content, ' +
          '.screens-grid, .nav, .btn, .cta, h1, h2, h3, h4, p, code, pre, table, input, button, a, figure, img, .dialog, .modal'
        );
        if (contentBlock) {
          overContent = true;
        }
      }

      if (overContent) {
        particle.classList.add('is-dimmed');
      } else {
        particle.classList.remove('is-dimmed');
      }

      if (isNear) {
        particle.classList.add('is-near-cursor');
      } else {
        particle.classList.remove('is-near-cursor');
      }

      // Вычисление динамического масштаба частицы
      var scale = 1;
      if (clickPhase) {
        scale = 1 + Math.sin(Math.min(1, Math.max(0, clickProgress)) * Math.PI) * .12;
        particle.classList.add('is-impulsed');
      } else if (isNear) {
        scale = 1.12;
        particle.classList.remove('is-impulsed');
      } else {
        particle.classList.remove('is-impulsed');
      }

      particle.style.transform =
        'translate3d(' + viewX.toFixed(1) + 'px,' + viewY.toFixed(1) + 'px,0) scale(' + scale.toFixed(2) + ')';
      particle.classList.add('is-moving');

      requestAnimationFrame(move);
    }

    requestAnimationFrame(move);
  })();

</script>

</body>
</html>
