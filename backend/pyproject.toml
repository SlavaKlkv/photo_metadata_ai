[project]
name = "photo-metadata-ai"
version = "0.1.0"
description = "AI-сервис для автоматической обработки метаданных фотографий"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "aiohttp>=3.9.3",
    "httpx>=0.27.0",
    "piexif>=1.1.3",
    "pillow>=12.2.0",
    "aiofiles>=25.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "E501"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
