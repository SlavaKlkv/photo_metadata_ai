name: Release macOS application

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Каждый срез собирается на своей архитектуре нативно. Сборка x86_64
  # под Rosetta на ARM-раннере — то самое слепое пятно, из-за которого
  # нерабочий Intel-бинарник доехал до релиза: Rosetta подтверждает лишь
  # факт запуска, транслируя x86_64 на ARM, и не проверяет SIMD-пути
  # numpy/Pillow, порядок байт в EXIF и выравнивание структур.
  build-backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13 # Intel
            arch: x86_64
          - os: macos-14 # Apple Silicon
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Скрипт сам проверяет, что uname -m совпадает с целевым срезом, и
      # прогоняет дымовой тест собранного бинарника.
      - name: Build backend (${{ matrix.arch }})
        run: desktop/scripts/build-mac.sh --backend-only=${{ matrix.arch }}

      - name: Upload backend binary
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.arch }}
          path: desktop/resources/backend/${{ matrix.arch }}/photo-metadata-backend
          retention-days: 1

  build-app:
    needs: build-backend
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches desktop version
        shell: bash
        run: |
          package_version="$(node -p "require('./desktop/package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match desktop/package.json version $package_version" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Download backend binaries
        uses: actions/download-artifact@v4
        with:
          pattern: backend-*
          path: artifacts

      # upload-artifact не сохраняет executable-бит, а раскладка по
      # подкаталогам {arm64,x86_64} обязательна: имя файла в них
      # одинаковое, по нему x64ArchFiles разводит срезы при universal-мерже.
      - name: Lay out backend binaries
        shell: bash
        run: |
          for arch in arm64 x86_64; do
            mkdir -p "desktop/resources/backend/$arch"
            cp "artifacts/backend-$arch/photo-metadata-backend" \
               "desktop/resources/backend/$arch/photo-metadata-backend"
            chmod +x "desktop/resources/backend/$arch/photo-metadata-backend"
            lipo -archs "desktop/resources/backend/$arch/photo-metadata-backend"
          done

      - name: Build and upload macOS artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        # electron-builder создаёт draft-релиз. Проверка обновлений увидит
        # его только после ручной публикации — это smoke-test-гейт.
        run: desktop/scripts/build-mac.sh --app-only --publish always
