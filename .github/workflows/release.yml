name: Release macOS application

on:
  push:
    tags:
      - 'v*'
  # Ручной запуск с вкладки Actions. Нужен, когда сборка упала по внешней
  # причине или когда надо проверить изменения в самой сборке, не выпуская
  # релиз: тег уже занят, а создавать лишний ради перезапуска незачем.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Загрузить артефакты в черновик релиза'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  # Бэкенд собирается нативно на Apple Silicon. Intel-срез убран вместе
  # с поддержкой архитектуры: macOS 26 Tahoe — последняя версия macOS
  # для Intel, а x86_64-раннеры GitHub Actions доступны лишь до 2027-го.
  build-backend:
    runs-on: macos-14 # Apple Silicon
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Скрипт сам проверяет, что uname -m совпадает с целевым срезом, и
      # прогоняет дымовой тест собранного бинарника.
      - name: Build backend (arm64)
        run: desktop/scripts/build-mac.sh --backend-only=arm64

      # Передаётся весь каталог: бэкенд собран в режиме onedir, рядом с
      # исполняемым файлом лежит _internal с Python и библиотеками. Без
      # него приложение не работает, а сборка внешне выглядит успешной.
      - name: Upload backend bundle
        uses: actions/upload-artifact@v4
        with:
          name: backend-arm64
          path: desktop/resources/backend/arm64/
          retention-days: 1

  build-app:
    needs: build-backend
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # При ручном запуске тега нет, сверять не с чем.
      - name: Verify tag matches desktop version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          package_version="$(node -p "require('./desktop/package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match desktop/package.json version $package_version" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Download backend bundle
        uses: actions/download-artifact@v4
        with:
          name: backend-arm64
          path: artifacts

      # upload-artifact не сохраняет executable-бит, а подкаталог с
      # архитектурой обязателен: по этому пути бинарник ищет
      # desktop/src/backend-process.js. lipo подтверждает, что срез
      # действительно arm64, а проверка _internal — что приехал весь
      # onedir-бандл, а не один исполняемый файл.
      - name: Lay out backend bundle
        shell: bash
        run: |
          mkdir -p desktop/resources/backend/arm64
          cp -R artifacts/. desktop/resources/backend/arm64/
          chmod +x desktop/resources/backend/arm64/photo-metadata-backend
          lipo -archs desktop/resources/backend/arm64/photo-metadata-backend | grep -qw arm64
          test -d desktop/resources/backend/arm64/_internal

      - name: Build and upload macOS artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        # Артефакты грузит сам build-mac.sh — после проверки образа и
        # сверки latest-mac.yml. Публикацию силами electron-builder
        # использовать нельзя: он заливает результат упаковки, не дожидаясь
        # этих проверок.
        #
        # Релиз создаётся черновиком: проверка обновлений увидит его
        # только после ручной публикации — это smoke-test-гейт.
        #
        # По тегу публикуем всегда, при ручном запуске — только если
        # попросили: обычно он нужен, чтобы проверить саму сборку.
        run: |
          if [[ "${{ github.ref_type }}" == "tag" || "${{ inputs.publish }}" == "true" ]]; then
            desktop/scripts/build-mac.sh --app-only --publish always
          else
            desktop/scripts/build-mac.sh --app-only
          fi

      # Размеры на лендинге правятся только здесь: они должны совпадать с
      # тем, что реально уехало в релиз. Локальная сборка легче CI-шной
      # (127,6 МБ против 135,0), поэтому запуск на машине разработчика
      # лендинг не трогает — иначе сайт получил бы заниженные числа.
      #
      # Сайт отдаётся Pages из main:/docs, а разработка идёт в develop,
      # так что правка коммитится в обе ветки: в main — чтобы обновился
      # сайт, в develop — чтобы следующая работа не начиналась со
      # старых чисел и не откатывала их обратно.
      #
      # main защищён rule «changes through pull request», поэтому прямой
      # push из workflow падает. develop обновляется push'ем, main — PR
      # из chore/landing-size-vX.Y.Z с автоматическим merge.
      - name: Update landing with actual release size
        if: github.ref_type == 'tag' || inputs.publish == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          node desktop/scripts/push-landing-release-update.js \
            --version "$version" \
            --app "desktop/out/mac-arm64/Photo Metadata AI.app" \
            --dmg "desktop/out/Photo Metadata AI-$version-arm64.dmg" \
            --landing docs/landing/index.html \
            --branches develop,main
